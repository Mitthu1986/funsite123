<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="min-h-screen w-full bg-[url('/bg.jpg')] bg-cover bg-center bg-no-repeat">
     <div class="flex min-h-screen items-center justify-center pr-6 sm:pr-10 lg:pr-16 gap-6 ">
        
  <div class="relative flex h-[280px] w-[320px] max-w-[85vw] sm:h-[360px] sm:w-[420px]">
            <video
                id="camera-feed"
                class="absolute inset-0 mt-8 h-full w-full rounded-2xl border border-white/20 bg-black object-cover shadow-2xl"
                autoplay
                playsinline
                muted
            >
                <canvas
                    id="preview"
                    aria-label="Captured preview"
                    class="absolute inset-0 h-full w-full rounded-2xl border border-white/20 bg-transparent object-cover shadow-2xl"
                ></canvas>
            </video>
            <div
                id="preview-frame-wrapper"
                class="absolute inset-0 h-full w-full pointer-events-none"
            >
                <img
                    src="frame.png"
                    alt="Video frame"
                    class="absolute inset-0 h-full w-full object-contain scale-[1.4] sm:scale-[1.6] -mt-5"
                >
            </div>
            </div>
            <div class="group relative">
                <img 
                src="switch1.png"
                id="switch"
                class="mb-4 mr-4 h-150 w-150 cursor-pointer p-2 transition-transform duration-200 group-toggle:hidden sm:h-100 sm:w-100"
                alt="Switch button"
                />
            
                <img
                src="switchon.png"
                id="switch-on"
                class=" hidden mb-4 mr-4 h-150 w-150 cursor-pointer p-2 transition-transform duration-200 group-toggle:block sm:h-100 sm:w-100"
                alt="Switch on button"
                />
                </div>
            </div>
<script src="main.js"></script>
<script>
    (function() {
        const video = document.getElementById('camera-feed');
        const previewCanvas = document.getElementById('preview');
        const switchButton = document.getElementById('switch');
        const switchOnButton = document.getElementById('switch-on');
        const FILTER_CLASSES = ['filter', 'contrast-100', 'brightness-150', 'saturate-100', 'hue-rotate-90', 'blur-10px', 'noise-2', 'sepia-400', 'invert-20'];

        if (switchButton && switchOnButton) {
            switchButton.addEventListener('click', () => {
                switchButton.classList.add('hidden');
                switchOnButton.classList.remove('hidden');
                if (video) video.classList.add(...FILTER_CLASSES);
                if (previewCanvas) previewCanvas.classList.add(...FILTER_CLASSES);
            });

            switchOnButton.addEventListener('click', () => {
                switchOnButton.classList.add('hidden');
                switchButton.classList.remove('hidden');
                if (video) video.classList.remove(...FILTER_CLASSES);
                if (previewCanvas) previewCanvas.classList.remove(...FILTER_CLASSES);
            });
        }
    })();
</script>
</body>
</html>
